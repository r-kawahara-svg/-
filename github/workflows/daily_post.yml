name: Daily WordPress Auto Post

on:
  schedule:
    - cron: '0 22 * * *'
  
  workflow_dispatch:

jobs:
  post-draft:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 自動投稿スクリプトの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python auto_post_daily.py
